name: CI

# `mainch` is this fork's development branch -- it MUST be listed here.
# While the triggers named only `main`, CI never ran on any of the
# UTF-8/Unicode transport commits and a broken test sat on HEAD unnoticed.
on:
  push:
    branches: [main, mainch]
  pull_request:
    branches: [main, mainch]

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npx vitest --run tests/unit/

      - name: Integration tests (mock watcher)
        run: npx vitest --run tests/integration/
